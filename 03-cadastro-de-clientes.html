<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07 | Orientação Objeto</title>
 
    <script type="text/javascript">
        class Cliente {
            constructor(cpf, nome, endereco, numero, telefone) {
                this.cpf = cpf; // this.cpf = propriedade || cpf = variavel
                this.nome = nome;
                this.endereco = endereco;
                this.numero = numero;
                this.telefone = telefone;
            }
            enderecoCompleto() {
                return this.endereco +', '+ this.numero;
            }
        }
 
        function exibirLista(lista) {
            let conteudo = "";
            for (let i = 0; i < lista.length; i++) {
                conteudo += '<li>'+
                    lista[i].cpf +' - '+
                    lista[i].nome +' - '+
                    lista[i].enderecoCompleto() +' - '+
                    lista[i].telefone +
                    '</li>';
            }
            return conteudo;
        }
 
        let listaClientes = [];
 
        window.onload = function() {
            document.getElementById('frmCliente').onsubmit = function(evento) {
                evento.preventDefault();
                let cpf = document.getElementById('cpf');
                let nome = document.getElementById('nome');
                let endereco = document.getElementById('endereco');
                let numero = document.getElementById('numero');
                let telefone = document.getElementById('telefone');
                let lista = document.getElementById('lista');
                if (cpf.value != '' && nome.value != '') {
                    let novoCliente = new Cliente(cpf.value, nome.value, endereco.value, numero.value, telefone.value);
                    listaClientes.push(novoCliente);
                    lista.innerHTML = exibirLista(listaClientes);
                    cpf.value = '';
                    nome.value = '';
                    endereco.value = '';
                    numero.value = '';
                    telefone.value = '';
                } else{
                    alert('Informa o CPF e o Nome!')
                }
            }
        }
 
       
    </script>
</head>
<body>
    <div>
        <h1>Cadastro de cliente</h1>
        <form id="frmCliente" action="#" method="POST">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>
            <br> <br>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <br> <br>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco">
            <br> <br>
            <label for="numero">Numero:</label>
            <input type="number" id="numero" name="numero" min="0">
            <br> <br>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone">
            <br> <br>
            <button>Cadastrar</button>
        </form>
        <ul id="lista"></ul>
    </div>
</body>
</html>
