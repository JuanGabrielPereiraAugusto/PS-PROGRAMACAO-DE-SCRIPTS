<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusão de Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    h2 {
      margin-bottom: 15px;
      color: #333;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-delete {
      background-color: #e74c3c;
      color: white;
    }

    .btn-delete:hover {
      background-color: #c0392b;
    }

    .btn-confirm, .btn-cancel {
      margin: 10px 5px;
      width: 100px;
    }

    .confirm-box {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Cadastro de João Silva</h2>
    <p>Email: joao@email.com</p>
    <button class="btn btn-delete" onclick="confirmarExclusao()">Excluir</button>

    <div class="confirm-box" id="confirmBox">
      <p>Tem certeza que deseja excluir?</p>
      <button class="btn btn-confirm" style="background-color: #2ecc71;" onclick="excluir()">Sim</button>
      <button class="btn btn-cancel" style="background-color: #95a5a6;" onclick="cancelar()">Não</button>
    </div>
  </div>

  <script>
    function confirmarExclusao() {
      document.getElementById("confirmBox").style.display = "block";
    }

    function cancelar() {
      document.getElementById("confirmBox").style.display = "none";
    }

    function excluir() {
      document.querySelector(".card").innerHTML = "<h2>Cadastro excluído com sucesso ✅</h2>";
    }
  </script>
</body>
</html>
