<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Cadastro de Carros</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #130ff2;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }

        .container {
            background-color: #f40c0c;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffffff;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ffffff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul#lista {
            margin-top: 30px;
            list-style: none;
            padding: 0;
        }

        ul#lista li {
            background-color: #e9ecef;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 15px;
        }
    </style>

    <script type="text/javascript">
        class Carro {
            constructor(placa, marca, modelo, ano, cor) {
                this.placa = placa;
                this.marca = marca;
                this.modelo = modelo;
                this.ano = ano;
                this.cor = cor;
            }
            descricaoCompleta() {
                return this.placa + ', ' + this.marca + ', ' + this.modelo + ', ' + this.ano + ', ' + this.cor;
            }
        }

        function exibirLista(lista) {
            let conteudo = '';
            for (let i = 0; i < lista.length; i++) {
                conteudo += '<li>' + lista[i].descricaoCompleta() + '</li>';
            }
            return conteudo;
        }

        let listaCarros = [];

        window.onload = function() {
            document.getElementById('frmCadastro').onsubmit = function(evento) {
                evento.preventDefault();

                let placa = document.getElementById('placa');
                let marca = document.getElementById('marca');
                let modelo = document.getElementById('modelo');
                let ano = document.getElementById('ano');
                let cor = document.getElementById('cor');
                let lista = document.getElementById('lista');

                if (placa.value !== '' && marca.value !== '') {
                    let novoCarro = new Carro(
                        placa.value,
                        marca.value,
                        modelo.value,
                        ano.value,
                        cor.value
                    );
                    listaCarros.push(novoCarro);
                    lista.innerHTML = exibirLista(listaCarros);

                    placa.value = '';
                    marca.value = '';
                    modelo.value = '';
                    ano.value = '';
                    cor.value = '';
                } else {
                    alert('Informe o número da placa e a marca do carro por favor!');
                }
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Carros</h1>
        <form id="frmCadastro" action="#" method="POST">
            <label for="placa">Placa:</label>
            <input type="text" id="placa" name="placa">

            <label for="marca">Marca:</label>
            <input type="text" id="marca" name="marca">

            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" name="modelo">

            <label for="ano">Ano:</label>
            <input type="text" id="ano" name="ano">

            <label for="cor">Cor:</label>
            <input type="text" id="cor" name="cor">

            <button type="submit">Cadastrar</button>
        </form>

        <ul id="lista"></ul>
    </div>
</body>
</html>
